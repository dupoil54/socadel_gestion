{% extends 'base.html' %}{% block content %}<h1>Bases techniques</h1><section class="card"><form method="post" class="grid"><input name="code" placeholder="Code" required><input name="name" placeholder="Nom de la base" required><input name="region" placeholder="Région" required><input name="department" placeholder="Département"><input name="localities" placeholder="Localités couvertes"><button>Ajouter</button></form></section><section class="card"><table><tr><th>Code</th><th>Base</th><th>Région</th><th>Département</th><th>Localités</th></tr>{% for b in bases %}<tr><td>{{b.code}}</td><td>{{b.name}}</td><td>{{b.region}}</td><td>{{b.department}}</td><td>{{b.localities}}</td></tr>{% endfor %}</table></section>{% endblock %}
